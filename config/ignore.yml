# Repos synced when --repo is not passed.
repos:
  - zenhr/zenhr

# Parked PRs picked up weeks later dominate the tail. Exclude by number, per repo.
ignore:
  zenhr/zenhr: []

# Extra bot logins, on top of Compute::NEVER_HUMAN. Anything ending in [bot], or
# with is_bot set, is already excluded. coderabbitai and github-actions are in
# NEVER_HUMAN and cannot be switched off from here.
bots: []
